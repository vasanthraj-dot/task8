<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking System</title>
    <link rel="stylesheet" href="./tab2.css">
</head>
<body>

    <div class="head">
        <img src="./logo.jpg" alt="Movie logo" id="logo">

        <div id="title">
            Movie Ticket Booking System
            <div id="subtitle">
                Choose your favorite movies. Select a showtime,
                Book your tickets and Enjoy the show!
            </div>
        </div>
    </div>

    <div class="blocks">

        <div class="title2">
            <div id="topic">Available Tickets</div>

            <div class="movies">
                <img src="./mandaadi.avif" alt="Movie 1" id="movie1">

                <div class="movdet">
                    <div class="name">Mandaadi</div>
                    <div class="time">7:00 PM</div>
                    <div class="rupees">₹ 280</div>
                </div>

                <img src="./baththa.avif" alt="Movie 2" id="movie2">

                <div class="movdet">
                    <div class="name">Baththa</div>
                    <div class="time">10:00 PM</div>
                    <div class="rupees">₹ 300</div>
                </div>

                <img src="./meesaya murukku 2.avif" alt="Movie 3" id="movie3">

                <div class="movdet">
                    <div class="name">Meesaya Murukku 2</div>
                    <div class="time">11:00 PM</div>
                    <div class="rupees">₹ 250</div>
                </div>
            </div>

            <div id="booked"></div>
        </div>

        <div id="bookings">
            <h3>Booked Tickets</h3>
            <p>No bookings yet.</p>
        </div>

    </div>

    <script src="tab3.js"></script>
</body>
</html>
